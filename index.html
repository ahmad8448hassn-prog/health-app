<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق صحتي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #219653;
        }
        .records {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .record-item {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-right: 4px solid #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>تطبيق صحتي</h2>
    <form id="healthForm">
        <div class="form-group">
            <label>التاريخ:</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>ساعات النوم:</label>
            <input type="number" step="0.5" id="sleep" placeholder="مثال: 7" required>
        </div>
        <div class="form-group">
            <label>الأكل والوجبات:</label>
            <textarea id="meals" placeholder="ماذا أكلت اليوم؟" rows="2" required></textarea>
        </div>
        <div class="form-group">
            <label>وقت استخدام الهاتف (بالساعات):</label>
            <input type="number" step="0.5" id="phoneTime" placeholder="مثال: 4" required>
        </div>
        <button type="submit">حفظ البيانات</button>
    </form>

    <div class="records">
        <h3>البيانات المسجلة:</h3>
        <div id="recordsList">لا توجد بيانات حتى الآن.</div>
    </div>
</div>

<script>
    const form = document.getElementById('healthForm');
    const recordsList = document.getElementById('recordsList');

    document.addEventListener('DOMContentLoaded', loadRecords);

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const date = document.getElementById('date').value;
        const sleep = document.getElementById('sleep').value;
        const meals = document.getElementById('meals').value;
        const phoneTime = document.getElementById('phoneTime').value;

        const record = { date, sleep, meals, phoneTime };
        
        let records = JSON.parse(localStorage.getItem('healthRecords')) || [];
        records.unshift(record);
        localStorage.setItem('healthRecords', JSON.stringify(records));

        form.reset();
        loadRecords();
    });

    function loadRecords() {
        let records = JSON.parse(localStorage.getItem('healthRecords')) || [];
        if (records.length === 0) {
            recordsList.innerHTML = 'لا توجد بيانات حتى الآن.';
            return;
        }

        recordsList.innerHTML = '';
        records.forEach(item => {
            const div = document.createElement('div');
            div.className = 'record-item';
            div.innerHTML = `<strong>التاريخ:</strong> ${item.date}<br>
                             <strong>النوم:</strong> ${item.sleep} ساعات<br>
                             <strong>الوجبات:</strong> ${item.meals}<br>
                             <strong>وقت الهاتف:</strong> ${item.phoneTime} ساعات`;
            recordsList.appendChild(div);
        });
    }
</script>

</body>
</html>
